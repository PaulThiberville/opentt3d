name: E2E navigateur (manuel et nocturne)

# Les tests E2E pilotent Chrome via CDP : ils sont volontairement hors du
# workflow CI de chaque PR pour préserver le quota Actions. Lancement manuel ou
# nocturne uniquement.
#
# Prérequis runner : Chrome (préinstallé sur ubuntu-latest, sinon le pas
# ci-dessous installe google-chrome-stable). Pas de cache npm : la politique du
# projet impose des caches de moins d'une heure et `npm ci` reste rapide.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Scénarios E2E (solo, sauvegardes, réseau local, join tardif)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier ou installer Google Chrome
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null || command -v google-chrome-stable >/dev/null; then
            google-chrome --version || google-chrome-stable --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Installer les dépendances
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Lancer les scénarios E2E
        run: npm run e2e

      - name: Publier les captures et le rapport (1 jour)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out-${{ github.run_id }}
          path: e2e-out/
          retention-days: 1
          if-no-files-found: warn
