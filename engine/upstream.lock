# Version d'OpenTTD utilisée par le moteur OpenTT3D.
# Toute mise à jour doit être faite ici, puis relancée avec `npm run engine:fetch`.
# Le SHA256 est celui publié dans le manifeste officiel :
# https://cdn.openttd.org/openttd-releases/15.3/manifest.yaml
OPENTTD_VERSION="15.3"
OPENTTD_SOURCE_URL="https://cdn.openttd.org/openttd-releases/${OPENTTD_VERSION}/openttd-${OPENTTD_VERSION}-source.tar.xz"
OPENTTD_SOURCE_SHA256="5ea21eea7d59c78a42071924ac18c6bc0116088f2e96b14cfee9369175973be7"

# Image Docker construite depuis os/emscripten/Dockerfile (emsdk 3.1.57),
# qui fournit emcc, cmake et le port liblzma utilisé par OpenTTD.
OPENTTD_EMSDK_IMAGE="emsdk-openttd"
OPENTTD_EMSDK_UPSTREAM_IMAGE="emscripten/emsdk:3.1.57"

# Base graphique libre (GPL v2) : indispensable pour lancer une partie
# headless sans passer par l'écran de téléchargement d'OpenGFX.
# https://cdn.openttd.org/opengfx-releases/8.0/manifest.yaml
OPENGFX_VERSION="8.0"
OPENGFX_URL="https://cdn.openttd.org/opengfx-releases/${OPENGFX_VERSION}/opengfx-${OPENGFX_VERSION}-all.zip"
OPENGFX_SHA256="43a0c1dabf39cb865394f3a6cc36d4da5c10ecfaaf55652043104806810903be"
